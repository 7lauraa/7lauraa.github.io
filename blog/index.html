---
layout: default
title: posts
pagination:
    enabled: true
---

<h2>posts</h2>
<ul id="recent-articles">
    {% for post in site.posts %}
        <li>
        {{ post.date | date: "%d %b %Y" }}:
        <a class="post-link" href="{{ post.url | relative_url }}" title="{{ post.description }}">{{ post.title | escape }}</a>
        </li>
    {% endfor %}
</ul>
